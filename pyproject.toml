[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "modusbi-mcp-server"
version = "1.0.0"
description = "MCP Server for ModusBI analytics portal"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE.docx"}

dependencies = [
    "mcp>=1.22.0,<2",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]
tokens = [
    "PyYAML>=6.0.0",
    "tiktoken>=0.13.0",
]
build = [
    "pyinstaller>=6.0.0",
]

[project.scripts]
modusbi-mcp = "app.server:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.tools" = ["tilemap_regions.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["app/tests"]
